<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Mental Peace Filter</title>
    <style>
        * { box-sizing: border-box; }

        body {
            width: 280px;
            margin: 0;
            padding: 18px 18px 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: linear-gradient(160deg, #f0fdf9 0%, #e0f2fe 100%);
            color: #1e293b;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .header-icon { font-size: 18px; }

        .title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #0f766e;
            letter-spacing: 0.2px;
        }

        .subtitle {
            margin: 4px 0 14px;
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(15, 118, 110, 0.06);
            backdrop-filter: blur(4px);
        }

        /* Toggle row */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-label {
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
        }

        .toggle-state {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #cbd5e1;
            border-radius: 22px;
            transition: background 0.2s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }

        input:checked + .slider {
            background: #14b8a6;
        }

        input:checked + .slider::before {
            transform: translateX(18px);
        }

        /* Stats */
        .stats {
            text-align: center;
            padding: 16px 12px;
        }

        .stats-label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }

        .stats-value {
            font-size: 32px;
            font-weight: 700;
            color: #0f766e;
            line-height: 1;
        }

        .stats-unit {
            font-size: 13px;
            color: #64748b;
            margin-left: 2px;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #94a3b8;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* Category toggles */
        .cat-heading {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin: 0 0 8px;
        }

        .cat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 12px;
            color: #334155;
            cursor: pointer;
        }

        .cat-row + .cat-row {
            border-top: 1px dashed rgba(0, 0, 0, 0.06);
        }

        .cat-row input[type="checkbox"] {
            accent-color: #14b8a6;
            width: 14px;
            height: 14px;
            cursor: pointer;
            margin: 0;
        }

        .cat-row .cat-desc {
            color: #94a3b8;
            font-size: 10px;
            display: block;
            margin-top: 1px;
        }

        /* Allowlist */
        .allow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 8px;
        }

        .allow-count {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .allow-empty {
            margin: 6px 0 0;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            padding: 10px 0 4px;
            line-height: 1.5;
        }

        .allow-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .allow-list::-webkit-scrollbar {
            width: 4px;
        }
        .allow-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }

        .allow-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 8px 0;
            border-top: 1px dashed rgba(0, 0, 0, 0.06);
        }

        .allow-item:first-child {
            border-top: none;
            padding-top: 2px;
        }

        .allow-item-body {
            flex: 1;
            min-width: 0;
        }

        .allow-item-text {
            font-size: 11px;
            color: #334155;
            line-height: 1.45;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .allow-item-type {
            display: inline-block;
            margin-top: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 1px 6px;
            border-radius: 4px;
            background: #f3f4f6;
            color: #57606a;
        }
        .allow-item-type[data-type="rush"]  { background: #ddf4ff; color: #0969da; }
        .allow-item-type[data-type="toxic"] { background: #ffebe9; color: #cf222e; }
        .allow-item-type[data-type="noise"] { background: #f1f5f9; color: #64748b; }

        .allow-item-remove {
            flex-shrink: 0;
            background: transparent;
            border: none;
            font-size: 16px;
            color: #cbd5e1;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            border-radius: 4px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .allow-item-remove:hover {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">🍃</span>
        <h1 class="title">마음의 평화 필터</h1>
    </div>
    <p class="subtitle">GitHub Issue/PR의 무례한 재촉·비난·노이즈를 부드럽게 순화합니다.</p>

    <div class="card">
        <div class="toggle-row">
            <div>
                <span class="toggle-label">필터 활성화</span>
                <span class="toggle-state" id="state">활성</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="card">
        <p class="cat-heading">필터 유형</p>
        <label class="cat-row">
            <input type="checkbox" class="cat-toggle" data-cat="rush">
            <span>
                재촉성 댓글 순화
                <span class="cat-desc">"언제 되나요", "bump", "ping" 등</span>
            </span>
        </label>
        <label class="cat-row">
            <input type="checkbox" class="cat-toggle" data-cat="toxic">
            <span>
                비난 댓글 블라인드
                <span class="cat-desc">"useless", "trash", "쓰레기" 등</span>
            </span>
        </label>
        <label class="cat-row">
            <input type="checkbox" class="cat-toggle" data-cat="noise">
            <span>
                저정보 노이즈 축소
                <span class="cat-desc">"+1", "same here", "저도요" 등</span>
            </span>
        </label>
    </div>

    <div class="card stats">
        <span class="stats-label">오늘 치유된 텍스트</span>
        <span class="stats-value" id="count">0</span><span class="stats-unit">개</span>
    </div>

    <div class="card">
        <div class="allow-header">
            <p class="cat-heading" style="margin:0;">허용 목록</p>
            <span class="allow-count" id="allow-count">0</span>
        </div>
        <p class="allow-empty" id="allow-empty">
            "Not harmful"로 추가된 항목이 여기 표시됩니다.
        </p>
        <ul class="allow-list" id="allow-list"></ul>
    </div>

    <div class="footer">made with 🌿 for tired maintainers</div>

    <script src="popup.js"></script>
</body>
</html>
